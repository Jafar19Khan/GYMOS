services:
  web:
    image: ${GYMOS_IMAGE:-gymos:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gymos-web
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      APP_URL: ${APP_URL:-http://localhost:3000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      ATTENDANCE_QR_SECRET: ${ATTENDANCE_QR_SECRET:-}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://gymos:local-gymos-password@db:5432/gymos?schema=public}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    container_name: gymos-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymos}
      POSTGRES_USER: ${POSTGRES_USER:-gymos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-gymos-password}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - gymos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymos} -d ${POSTGRES_DB:-gymos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  gymos-postgres:
