services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gymos-web
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${DATABASE_URL:-postgresql://gymos:local-gymos-password@db:5432/gymos?schema=public}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    container_name: gymos-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymos}
      POSTGRES_USER: ${POSTGRES_USER:-gymos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-gymos-password}
    ports:
      - "5432:5432"
    volumes:
      - gymos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymos} -d ${POSTGRES_DB:-gymos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  gymos-postgres:
