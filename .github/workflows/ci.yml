name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate, lint, typecheck, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gymos
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gymos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymos -d gymos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gymos:ci-only-password@localhost:5432/gymos?schema=public
      GYMOS_IMAGE: gymos:ci
      WEB_HOST_PORT: "3000"
      POSTGRES_HOST_PORT: "55432"
      POSTGRES_PASSWORD: ci-only-compose-password
      DATABASE_URL_DOCKER: postgresql://gymos:ci-only-compose-password@db:5432/gymos?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply database migrations
        run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Build production Docker image
        run: docker build --file docker/Dockerfile --tag gymos:ci .
      - name: Start production Compose stack
        run: docker compose --file docker/compose.yaml up --no-build --detach
      - name: Check service health and database readiness
        shell: bash
        run: |
          ready=0
          for attempt in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null \
              && curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:3000/api/ready; then
              ready=1
              break
            fi
            running="$(docker inspect --format='{{.State.Running}}' gymos-web 2>/dev/null || echo false)"
            if [ "$running" != "true" ]; then
              echo "GYMOS web container stopped before readiness."
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            docker compose --file docker/compose.yaml ps
            docker compose --file docker/compose.yaml logs --no-color web db
            exit 1
          fi
      - name: Tear down Compose smoke test
        if: always()
        run: docker compose --file docker/compose.yaml down -v
